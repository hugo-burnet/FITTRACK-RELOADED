<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` : sans lui, le clavier logiciel se pose
      PAR-DESSUS la vue sans en réduire la hauteur (comportement Android par
      défaut, `resizes-visual`). Le conteneur défilant garde alors sa pleine
      hauteur 100dvh, une liste courte ne déborde pas, et ses derniers résultats
      restent piégés derrière le clavier — impossibles à faire remonter. Reporté
      du téléphone : recherche d'exercice, on ne pouvait plus scroller la liste.
      Avec `resizes-content`, la vue mise en page rétrécit à la zone au-dessus du
      clavier, la liste déborde et redevient défilable.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#12110f" />
    <meta property="og:title" content="FitTrack" />
    <meta
      property="og:description"
      content="Suivi de musculation personnel. Local-first, hors-ligne, sans compte."
    />
    <meta property="og:image" content="https://hugo-burnet.github.io/FITTRACK-RELOADED/github-banner.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>FitTrack</title>
    <!--
      Sans cette ligne le navigateur réclame /favicon.ico à la RACINE du domaine
      (hugo-burnet.github.io/favicon.ico, hors du base path) et prend un 404 à
      chaque chargement — du bruit qui finit par masquer les vraies erreurs.

      Dessinée en SVG inline plutôt qu'en fichier : aucune requête réseau, donc
      rien à mettre en cache hors-ligne. C'est la barre chargée de l'onglet
      Accueil, à traits épaissis pour rester lisible à 16 px.

      Elle reste en data-URI même depuis le Lot 9, qui a pourtant ajouté
      public/icon.svg : le favori s'affiche au premier rendu, avant que le
      service worker n'existe. Un fichier coûterait une requête réseau à cet
      instant précis, et le jour où elle échoue on regarde une page sans icône.
      Le jeu 192/512/maskable, lui, vit dans le manifeste — un lanceur lit le
      manifeste, jamais cette ligne.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312110f'/%3E%3Cg stroke='%23ff8a3d' stroke-width='3.2' stroke-linecap='round'%3E%3Cpath d='M11 16h10'/%3E%3Cpath d='M9.5 11v10'/%3E%3Cpath d='M22.5 11v10'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!--
      iOS ne lit pas le manifeste pour choisir l'icône de l'écran d'accueil : il
      lit cette balise, et rien d'autre. Sans elle, « Sur l'écran d'accueil »
      depuis Safari pose une capture de la page en guise d'icône.
      Le chemin est relatif pour rester valable sous le `base` du dépôt.
    -->
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <!--
      Le module principal est différé : sans ce script bloquant, un utilisateur en
      thème clair voit un flash noir à chaque démarrage. Doit rester synchrone et
      utiliser la même clé que src/stores/theme.ts.
    -->
    <script>
      (function () {
        var theme = localStorage.getItem('fittrack:theme') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'light' ? '#f7f8f6' : '#12110f');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
