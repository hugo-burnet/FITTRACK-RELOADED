name: Android APK

on:
  push:
    branches: [master]
    tags: ['v*']
  # Publier une release sans avoir la main sur un tag.
  #
  # Le chemin normal reste `git tag -a vX.Y.Z && git push origin vX.Y.Z`. Mais
  # il suppose un poste avec les droits de pousser un tag, et ça n'est pas
  # toujours le cas — une session d'agent, par exemple, peut pousser une branche
  # et se voir refuser `refs/tags/*`. Le code partait alors sur `master`, l'APK
  # dormait en artefact 30 jours, et la page Releases restait en arrière.
  #
  # Renseigner `release_tag` ici publie la release depuis l'onglet Actions.
  # `gh release create` crée le tag lui-même, sur le commit qui vient d'être
  # construit : un seul geste, et le tag ne peut pas désigner autre chose que ce
  # qu'on a testé. Laisser le champ vide ne fait qu'un build d'essai, comme avant.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag à publier (ex. v0.8.7). Vide = build seul, sans release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vide sur un push : `inputs` n'existe pas hors de workflow_dispatch.
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run android:sync
      # Une release taguée doit être signée avec la vraie clé, sinon elle ne peut
      # pas mettre à jour une installation existante. Un APK d'essai, non : Gradle
      # a sa clé de debug, et un dépôt de test n'a aucune raison de détenir la
      # clé de signature de la production. Exiger les secrets partout rendait ce
      # workflow inutilisable ailleurs que dans le dépôt principal.
      - name: Choose how the APK is signed
        id: signing
        shell: bash
        env:
          FITTRACK_ANDROID_KEYSTORE_BASE64: ${{ secrets.FITTRACK_ANDROID_KEYSTORE_BASE64 }}
          FITTRACK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FITTRACK_ANDROID_KEYSTORE_PASSWORD }}
          FITTRACK_ANDROID_KEY_ALIAS: ${{ secrets.FITTRACK_ANDROID_KEY_ALIAS }}
          FITTRACK_ANDROID_KEY_PASSWORD: ${{ secrets.FITTRACK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in FITTRACK_ANDROID_KEYSTORE_BASE64 FITTRACK_ANDROID_KEYSTORE_PASSWORD FITTRACK_ANDROID_KEY_ALIAS FITTRACK_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            printf '%s' "$FITTRACK_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fittrack.jks"
            echo "keystore=true" >> "$GITHUB_OUTPUT"
            echo "::notice::APK signé avec la clé de release."
          elif [[ ( "$GITHUB_REF" == refs/tags/v* || -n "${RELEASE_TAG:-}" ) && "$GITHUB_REPOSITORY" == "hugo-burnet/FITTRACK-RELOADED" ]]; then
            # Seul le dépôt principal distribue l'application aux appareils qui
            # l'ont déjà : une release y publier sans la vraie clé donnerait un
            # APK incapable de mettre à jour l'installation en place.
            echo "::error::Une release du dépôt principal exige les secrets de signature. Manquants : ${missing[*]}"
            exit 1
          else
            echo "keystore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets de signature absents (${missing[*]}) — APK signé avec la clé de debug de Gradle."
          fi
      - name: Build the APK
        env:
          # Vide quand il n'y a pas de clé : android/app/build.gradle exige les
          # quatre valeurs et retombe sur la signature de debug s'il en manque une.
          FITTRACK_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore == 'true' && format('{0}/fittrack.jks', runner.temp) || '' }}
          FITTRACK_KEYSTORE_PASSWORD: ${{ secrets.FITTRACK_ANDROID_KEYSTORE_PASSWORD }}
          FITTRACK_KEY_ALIAS: ${{ secrets.FITTRACK_ANDROID_KEY_ALIAS }}
          FITTRACK_KEY_PASSWORD: ${{ secrets.FITTRACK_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug \
            -PfittrackVersionCode="${{ github.run_number }}" \
            -PfittrackVersionName="$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v4
        with:
          name: fittrack-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Prepare release APK
        id: asset
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          # Le tag vient de la saisie quand on publie à la main, du ref sinon.
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          # Le nom du fichier dit avec quelle clé il est signé : deux APK qui se
          # ressemblent et ne s'installent pas l'un sur l'autre, c'est le genre
          # de confusion qu'on ne veut pas six mois plus tard.
          if [[ "${{ steps.signing.outputs.keystore }}" == "true" ]]; then
            name="FitTrack-${tag}.apk"
          else
            name="FitTrack-test-${tag}.apk"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.asset.outputs.tag }}
          ASSET: ${{ steps.asset.outputs.name }}
        shell: bash
        # `--target` sur le SHA construit : lancé depuis Actions, le tag n'existe
        # pas encore et `gh` le crée. Il ne peut donc désigner que le commit qui
        # vient de passer les portes, jamais la tête d'une branche qui a bougé
        # entre-temps.
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "FitTrack Android $TAG" \
            --generate-notes
