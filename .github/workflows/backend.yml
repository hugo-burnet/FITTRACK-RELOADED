name: Backend tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python manage.py test sync_app --settings=fittrack_server.test_settings --noinput
      - run: python manage.py makemigrations --check --dry-run --settings=fittrack_server.test_settings
